  var root = document.getElementById("app-root");

  // ---------------------------------------------------------------------
  // STATE
  // ---------------------------------------------------------------------
  var params = new URLSearchParams(window.location.search);
  var token = params.get("token");

  function getSessionId() {
    if (!token) return null;
    var key = "wb_session_" + token;
    var existing = window.localStorage.getItem(key);
    if (existing) return existing;
    var fresh = (crypto.randomUUID ? crypto.randomUUID() : "sess-" + Date.now() + "-" + Math.random().toString(16).slice(2));
    window.localStorage.setItem(key, fresh);
    return fresh;
  }
  var sessionId = getSessionId();

  var state = {
    pendingFirstQuestion: null, // holds the parsed first question while Instructions is shown
    timerInterval: null,
    timeLeft: 30,
    selectedOption: null,
    currentQuestion: null // { questionNumber, totalQuestions, questionText, options }
  };

  // ---------------------------------------------------------------------
  // BACKEND CALL
  // ---------------------------------------------------------------------
  function callBackend(message) {
    return fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId: sessionId, token: token, message: message })
    }).then(function (res) {
      if (!res.ok) throw new Error("Request failed with status " + res.status);
      return res.json();
    });
  }

  // ---------------------------------------------------------------------
  // PARSE the relayed question text into structured data.
  // Backend format:
  // "**Question N of M**\n\n<question text>\n\n- **A.** <a>\n- **B.** <b>\n- **C.** <c>\n- **D.** <d>\n\n..."
  // ---------------------------------------------------------------------
  function parseQuestion(output) {
    var headerMatch = output.match(/\*\*Question\s+(\d+)\s+of\s+(\d+)\*\*/i);
    if (!headerMatch) return null;

    var afterHeader = output.slice(headerMatch.index + headerMatch[0].length);
    var optionAIdx = afterHeader.search(/-\s*\*\*A\.\*\*/);
    var questionText = optionAIdx > -1 ? afterHeader.slice(0, optionAIdx).trim() : afterHeader.trim();

    function extractOption(letter) {
      var re = new RegExp("-\\s*\\*\\*" + letter + "\\.\\*\\*\\s*([^\\n]+)");
      var m = afterHeader.match(re);
      return m ? m[1].trim() : "";
    }

    return {
      questionNumber: parseInt(headerMatch[1], 10),
      totalQuestions: parseInt(headerMatch[2], 10),
      questionText: questionText,
      options: {
        A: extractOption("A"),
        B: extractOption("B"),
        C: extractOption("C"),
        D: extractOption("D")
      }
    };
  }

  // ---------------------------------------------------------------------
  // RENDER HELPERS
  // ---------------------------------------------------------------------
  function clear() { root.innerHTML = ""; }

  function iconCircle(icon, colorClasses) {
    return '<div class="w-16 h-16 rounded-full ' + colorClasses + ' flex items-center justify-center mb-6">' +
      '<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: \'FILL\' 1;">' + icon + '</span>' +
      '</div>';
  }

  function renderCard(innerHtml, maxWidthClass) {
    clear();
    var wrap = document.createElement("div");
    wrap.className = "bg-surface-container-lowest w-full " + (maxWidthClass || "max-w-md") +
      " rounded-xl border border-outline-variant shadow-[0px_4px_12px_rgba(0,0,0,0.03)] p-8 md:p-12 flex flex-col items-center justify-center text-center fade-in";
    wrap.innerHTML = innerHtml;
    root.appendChild(wrap);
  }

  // ---------------------------------------------------------------------
  // VIEW: Authenticating
  // ---------------------------------------------------------------------
  function viewAuthenticating() {
    renderCard(
      '<div class="mb-8 flex flex-col items-center">' +
        '<h1 class="font-headline-md text-headline-md text-on-surface font-semibold">Wissen Baum</h1>' +
        '<p class="font-label-md text-label-md text-on-surface-variant mt-1">Assessment Portal</p>' +
      '</div>' +
      '<div class="relative w-16 h-16 mb-6 flex items-center justify-center">' +
        '<svg class="absolute inset-0 w-full h-full text-surface-variant animate-spin" fill="none" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" stroke="currentColor" stroke-width="4"></circle></svg>' +
        '<svg class="absolute inset-0 w-full h-full text-primary animate-spin" fill="none" style="animation-direction: reverse; animation-duration: 1.5s;" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" stroke="currentColor" stroke-dasharray="70 200" stroke-linecap="round" stroke-width="4"></circle></svg>' +
        '<span class="material-symbols-outlined text-primary text-xl" style="font-variation-settings: \'FILL\' 1;">lock</span>' +
      '</div>' +
      '<div class="space-y-2">' +
        '<h2 class="font-headline-sm text-headline-sm text-on-surface">Authenticating...</h2>' +
        '<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">Securely connecting to your candidate profile. Please wait.</p>' +
      '</div>'
    );
  }

  // ---------------------------------------------------------------------
  // VIEW: generic info/error/already-completed card
  // ---------------------------------------------------------------------
  function viewInfo(opts) {
    // opts: { icon, iconColorClasses, heading, message }
    renderCard(
      iconCircle(opts.icon, opts.iconColorClasses) +
      '<h1 class="font-headline-md text-headline-md text-on-surface mb-4">' + escapeHtml(opts.heading) + '</h1>' +
      '<p class="font-body-md text-body-md text-on-surface-variant max-w-md">' + escapeHtml(opts.message) + '</p>',
      "max-w-lg"
    );
  }

  function viewNoToken() {
    viewInfo({
      icon: "error",
      iconColorClasses: "bg-tertiary/10 text-tertiary",
      heading: "No assessment link found",
      message: "This page needs a valid assessment link. Please use the link from your invitation email."
    });
  }

  function viewNetworkError(retryFn) {
    clear();
    var wrap = document.createElement("div");
    wrap.className = "bg-surface-container-lowest w-full max-w-lg rounded-xl border border-outline-variant shadow-[0px_4px_12px_rgba(0,0,0,0.03)] p-8 md:p-12 flex flex-col items-center justify-center text-center fade-in";
    wrap.innerHTML =
      iconCircle("wifi_off", "bg-tertiary/10 text-tertiary") +
      '<h1 class="font-headline-md text-headline-md text-on-surface mb-4">Connection problem</h1>' +
      '<p class="font-body-md text-body-md text-on-surface-variant max-w-md mb-6">We could not reach the assessment server. Please check your connection and try again.</p>' +
      '<button id="retry-btn" class="bg-primary text-on-primary font-label-md text-label-md px-8 py-3 rounded hover:bg-[#005a26] transition-colors">Try again</button>';
    root.appendChild(wrap);
    document.getElementById("retry-btn").addEventListener("click", retryFn);
  }

  // ---------------------------------------------------------------------
  // VIEW: Instructions
  // ---------------------------------------------------------------------
  function viewInstructions(firstQuestion) {
    clear();
    var total = firstQuestion.totalQuestions;
    var wrap = document.createElement("div");
    wrap.className = "bg-surface-container-lowest rounded-xl border border-outline-variant p-8 md:p-12 w-full max-w-3xl shadow-[0px_4px_12px_rgba(0,0,0,0.03)] relative overflow-hidden fade-in";
    wrap.innerHTML =
      '<div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>' +
      '<div class="text-center mb-10">' +
        '<h2 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-4">Welcome to your Wissen Baum assessment</h2>' +
        '<p class="font-body-md text-body-md text-on-surface-variant max-w-xl mx-auto">Please read the following instructions carefully before proceeding.</p>' +
      '</div>' +
      '<div class="space-y-6 mb-10">' +
        instructionRow("list_alt", "primary", "Number of questions", "The assessment consists of " + total + " multiple-choice questions designed to evaluate your aptitude.") +
        instructionRow("check_circle", "primary", "No negative marking", "There is no penalty for incorrect answers. Attempt all questions.") +
        instructionRow("timer", "tertiary", "30 seconds per question", "You will have exactly 30 seconds to answer each question. The timer starts as soon as the question appears, and an unanswered question is automatically skipped.") +
        instructionRow("rule", "primary", "Answer format", "Select the option that best answers the question, then click Save (or Submit on the final question).") +
        instructionRow("view_carousel", "primary", "Sequential flow", "Questions are presented one at a time. You cannot go back to previous questions.") +
      '</div>' +
      '<div class="flex justify-center mt-8 pt-8 border-t border-outline-variant">' +
        '<button id="proceed-btn" class="bg-primary hover:bg-[#005a26] text-on-primary font-label-md text-label-md py-3 px-8 rounded-full transition-colors duration-200 flex items-center gap-2 shadow-sm">' +
          'Proceed <span class="material-symbols-outlined text-sm">arrow_forward</span>' +
        '</button>' +
      '</div>';
    root.appendChild(wrap);
    document.getElementById("proceed-btn").addEventListener("click", function () {
      showQuestion(firstQuestion);
    });
  }

  function instructionRow(icon, colorKey, title, body) {
    var bg = colorKey === "primary" ? "bg-primary-container/20 text-primary" : "bg-tertiary-container/20 text-tertiary";
    return '<div class="flex items-start gap-4">' +
      '<div class="flex-shrink-0 w-8 h-8 rounded-full ' + bg + ' flex items-center justify-center mt-0.5">' +
        '<span class="material-symbols-outlined text-xl" style="font-variation-settings: \'FILL\' 1;">' + icon + '</span>' +
      '</div>' +
      '<div>' +
        '<h3 class="font-headline-sm text-headline-sm text-on-surface mb-1">' + escapeHtml(title) + '</h3>' +
        '<p class="font-body-md text-body-md text-on-surface-variant">' + escapeHtml(body) + '</p>' +
      '</div>' +
    '</div>';
  }

  // ---------------------------------------------------------------------
  // VIEW: Question (core screen)
  // ---------------------------------------------------------------------
  function showQuestion(q) {
    state.currentQuestion = q;
    state.selectedOption = null;
    renderQuestion();
    startTimer(q.questionTimeoutSeconds || 30);
  }

  function renderQuestion() {
    clear();
    var q = state.currentQuestion;
    var isLast = q.questionNumber >= q.totalQuestions;
    var pct = Math.round((q.questionNumber / q.totalQuestions) * 100);

    var wrap = document.createElement("div");
    wrap.className = "bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm w-full max-w-3xl overflow-hidden flex flex-col relative fade-in";
    wrap.innerHTML =
      '<div class="h-1 w-full bg-surface-variant absolute top-0 left-0">' +
        '<div class="h-full bg-primary transition-all duration-300" style="width: ' + pct + '%;"></div>' +
      '</div>' +
      '<div class="p-8 flex flex-col gap-8 mt-1">' +
        '<div class="flex justify-between items-center border-b border-surface-variant pb-4">' +
          '<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Question ' + q.questionNumber + ' of ' + q.totalQuestions + '</span>' +
          '<div id="timer-pill" class="bg-primary-container text-on-primary-container font-bold text-label-md px-6 py-2 rounded-full flex items-center gap-2 border-2 border-primary shadow-sm transition-colors">' +
            '<span class="material-symbols-outlined" style="font-size: 18px;">timer</span>' +
            '<span id="timer-text" class="tracking-tight">0:30</span>' +
          '</div>' +
        '</div>' +
        '<div class="py-4"><h2 class="font-headline-lg text-headline-lg text-on-surface">' + escapeHtml(q.questionText) + '</h2></div>' +
        '<div id="options-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>' +
        '<div class="pt-6 border-t border-surface-variant flex justify-end">' +
          '<button id="save-btn" disabled class="bg-primary text-on-primary font-label-md text-label-md px-8 py-3 rounded w-full md:w-auto hover:bg-[#005a26] transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">' +
            (isLast ? "Submit" : "Save &amp; Continue") +
            ' <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>' +
          '</button>' +
        '</div>' +
      '</div>';
    root.appendChild(wrap);

    var grid = document.getElementById("options-grid");
    ["A", "B", "C", "D"].forEach(function (letter) {
      var text = q.options[letter] || "";
      var label = document.createElement("label");
      label.className = "group relative flex items-start cursor-pointer rounded-lg border border-outline-variant p-4 hover:bg-surface-container-low transition-colors duration-200";
      label.innerHTML =
        '<input class="peer sr-only" name="mcq-option" type="radio" value="' + letter + '">' +
        '<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center mr-4 mt-0.5 peer-checked:border-primary peer-checked:bg-primary transition-all">' +
          '<span class="material-symbols-outlined text-white text-xs opacity-0 peer-checked:opacity-100 font-bold">check</span>' +
        '</div>' +
        '<div class="flex-grow">' +
          '<div class="flex items-center gap-2 mb-1">' +
            '<span class="bg-surface-variant text-on-surface px-2 py-0.5 rounded text-xs font-bold font-mono">' + letter + '</span>' +
          '</div>' +
          '<span class="font-body-md text-body-md text-on-surface-variant block">' + escapeHtml(text) + '</span>' +
        '</div>' +
        '<div class="absolute inset-0 border-2 border-transparent rounded-lg pointer-events-none peer-checked:border-primary peer-checked:shadow-[0_0_0_2px_rgba(34,197,94,0.2)] transition-all"></div>';
      grid.appendChild(label);
    });

    var radios = grid.querySelectorAll('input[name="mcq-option"]');
    var saveBtn = document.getElementById("save-btn");
    radios.forEach(function (r) {
      r.addEventListener("change", function () {
        state.selectedOption = r.value;
        saveBtn.removeAttribute("disabled");
      });
    });
    saveBtn.addEventListener("click", function () {
      submitAnswer(state.selectedOption || "SKIP");
    });
  }

  function startTimer(seconds) {
    clearInterval(state.timerInterval);
    state.timeLeft = seconds;
    updateTimerDisplay();
    state.timerInterval = setInterval(function () {
      state.timeLeft -= 1;
      updateTimerDisplay();
      if (state.timeLeft <= 0) {
        clearInterval(state.timerInterval);
        handleTimeout();
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    var pill = document.getElementById("timer-pill");
    var text = document.getElementById("timer-text");
    if (!pill || !text) return;
    var m = Math.floor(state.timeLeft / 60);
    var s = state.timeLeft % 60;
    text.textContent = m + ":" + (s < 10 ? "0" : "") + s;
    if (state.timeLeft <= 10) {
      pill.classList.remove("bg-primary-container", "text-on-primary-container", "border-primary");
      pill.classList.add("bg-tertiary-container", "text-on-tertiary-container", "border-tertiary");
    }
  }

  function handleTimeout() {
    disableQuestionInputs();
    submitAnswer("SKIP");
  }

  function disableQuestionInputs() {
    var grid = document.getElementById("options-grid");
    var saveBtn = document.getElementById("save-btn");
    if (grid) grid.querySelectorAll('input[name="mcq-option"]').forEach(function (r) { r.disabled = true; });
    if (saveBtn) saveBtn.setAttribute("disabled", "true");
  }

  function submitAnswer(answer) {
    clearInterval(state.timerInterval);
    disableQuestionInputs();
    callBackend(answer).then(handleBackendResponse).catch(function () {
      viewNetworkError(function () { submitAnswer(answer); });
    });
  }

  // ---------------------------------------------------------------------
  // VIEW: Closing
  // ---------------------------------------------------------------------
  function viewClosing(message, closeAfterSeconds) {
    clear();
    var wrap = document.createElement("div");
    wrap.className = "bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.03)] max-w-[540px] w-full p-10 flex flex-col items-center text-center relative overflow-hidden fade-in";
    wrap.innerHTML =
      '<div class="absolute top-0 left-0 right-0 h-1 bg-primary"></div>' +
      iconCircle("check_circle", "bg-primary-container text-on-primary-container") +
      '<h1 class="font-headline-lg text-headline-lg text-on-surface mb-4">Thank you</h1>' +
      '<p class="font-body-lg text-body-lg text-on-surface-variant mb-12 max-w-[400px]">' + escapeHtml(message) + '</p>' +
      '<div class="mt-4 pt-6 border-t border-surface-variant w-full">' +
        '<p class="font-caption text-caption text-on-surface-variant opacity-70" id="countdown-text">Closing in <span id="countdown-timer">' + (closeAfterSeconds || 10) + '</span>s</p>' +
      '</div>';
    root.appendChild(wrap);

    var timeLeft = closeAfterSeconds || 10;
    var timerEl = document.getElementById("countdown-timer");
    var textEl = document.getElementById("countdown-text");
    var interval = setInterval(function () {
      timeLeft -= 1;
      if (timerEl) timerEl.textContent = timeLeft;
      if (timeLeft <= 0) {
        clearInterval(interval);
        if (textEl) textEl.textContent = "This window can now be closed.";
      }
    }, 1000);
  }

  // ---------------------------------------------------------------------
  // RESPONSE ROUTING
  // ---------------------------------------------------------------------
  function handleBackendResponse(data) {
    var output = (data && data.output) || "";

    if (data && data.error) {
      viewInfo({
        icon: "error",
        iconColorClasses: "bg-tertiary/10 text-tertiary",
        heading: "We hit a problem",
        message: output || "Something went wrong validating your session. Please contact the recruiting team."
      });
      return;
    }

    if (data && data.alreadyCompleted) {
      viewInfo({
        icon: "check_circle",
        iconColorClasses: "bg-primary-container text-on-primary-container",
        heading: "Assessment already completed",
        message: output || "Thank you \u2014 no further action is needed. If you believe this is a mistake, please contact the recruiting team."
      });
      return;
    }

    if (data && data.isFinal) {
      viewClosing(output || "Your assessment has been submitted.", data.closeAfterSeconds || 10);
      return;
    }

    var parsed = parseQuestion(output);
    if (!parsed) {
      // Fallback: couldn't parse a question out of the response - show it as plain info
      viewInfo({
        icon: "info",
        iconColorClasses: "bg-secondary/10 text-secondary",
        heading: "Notice",
        message: output || "Something unexpected happened. Please contact the recruiting team if this persists."
      });
      return;
    }

    parsed.questionTimeoutSeconds = data.questionTimeoutSeconds || 30;
    if (data.totalQuestions) parsed.totalQuestions = data.totalQuestions;
    if (data.questionNumber) parsed.questionNumber = data.questionNumber;

    if (parsed.questionNumber === 1 && !state.currentQuestion) {
      // First-ever question for this candidate: show Instructions first.
      viewInstructions(parsed);
    } else {
      showQuestion(parsed);
    }
  }

  // ---------------------------------------------------------------------
  // BOOT
  // ---------------------------------------------------------------------
  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  function boot() {
    if (!token) {
      viewNoToken();
      return;
    }
    viewAuthenticating();
    callBackend(token).then(handleBackendResponse).catch(function () {
      viewNetworkError(boot);
    });
  }

  boot();
})();
</script>
</body>
</html>
